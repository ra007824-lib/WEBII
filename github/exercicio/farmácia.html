
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2.a</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            font-size: 28px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"] {
            width: 200px;
            padding: 4px;
        }
        button {
            margin-top: 20px;
            padding: 6px 12px;
        }
        #resultado {
            margin-top: 20px;
        }
        #resultado p {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
 
    <h1>Farmácia JS</h1>
 
    <label for="medicamento">Medicamento:</label>
    <input type="text" id="medicamento" value="Aspirina">
 
    <label for="preco">Preço R$:</label>
    <input type="number" id="preco" step="0.01" value="12.45">
 
    <br>
    <button onclick="mostrarPromocao()">Mostrar Promoção</button>
 
    <div id="resultado"></div>
 
    <script>
        function mostrarPromocao() {
            var medicamento = document.getElementById("medicamento").value;
            var preco = parseFloat(document.getElementById("preco").value);
 
            var total = preco * 2;
 
            // pega os centavos do valor total (parte decimal)
            var centavos = Math.round((total - Math.floor(total)) * 100) / 100;
 
            var valorPromocao = total - centavos;
 
            var resultado = document.getElementById("resultado");
            resultado.innerHTML =
                "<p>Promoção de " + medicamento + "</p>" +
                "<p>Leve 2 por apenas R$: " + valorPromocao.toFixed(2) + "</p>";
        }
    </script>
 
</body>
</html>
