<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2.b</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            font-size: 28px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"] {
            width: 200px;
            padding: 4px;
        }
        button {
            margin-top: 20px;
            padding: 6px 12px;
        }
        #resultado {
            margin-top: 20px;
        }
        #resultado p {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
 
    <h1>Lan House JS</h1>
 
    <label for="valor15">Valor por 15min de Uso R$:</label>
    <input type="number" id="valor15" step="0.01" value="3.00">
 
    <label for="tempo">Tempo de Uso do Cliente:</label>
    <input type="number" id="tempo" value="25">
 
    <br>
    <button onclick="calcularValor()">Calcular Valor a Pagar</button>
 
    <div id="resultado"></div>
 
    <script>
        function calcularValor() {
            var valor15 = parseFloat(document.getElementById("valor15").value);
            var tempo = parseFloat(document.getElementById("tempo").value);
 
            // quantidade de frações de 15 minutos, arredondando para cima
            var fracoes = Math.ceil(tempo / 15);
 
            var valorPagar = fracoes * valor15;
 
            var resultado = document.getElementById("resultado");
            resultado.innerHTML =
                "<p>Valor a Pagar R$: " + valorPagar.toFixed(2) + "</p>";
        }
    </script>
 
</body>
</html>
