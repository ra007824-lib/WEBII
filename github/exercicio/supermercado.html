!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2.c</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            font-size: 28px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"] {
            width: 200px;
            padding: 4px;
        }
        button {
            margin-top: 20px;
            padding: 6px 12px;
        }
        #resultado {
            margin-top: 20px;
        }
        #resultado p {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
 
    <h1>Supermercado JS</h1>
 
    <label for="produto">Produto:</label>
    <input type="text" id="produto" value="Creme Dental">
 
    <label for="preco">Preço R$:</label>
    <input type="number" id="preco" step="0.01" value="6.00">
 
    <br>
    <button onclick="verPromocao()">Ver Promoção</button>
 
    <div id="resultado"></div>
 
    <script>
        function verPromocao() {
            var produto = document.getElementById("produto").value;
            var preco = parseFloat(document.getElementById("preco").value);
 
            var precoTerceiro = preco / 2;
            var valorTotal = (preco * 2) + precoTerceiro;
 
            var resultado = document.getElementById("resultado");
            resultado.innerHTML =
                "<p>" + produto + " - Promoção: Leve 3 por R$: " + valorTotal.toFixed(2) + "</p>" +
                "<p>O 3&ordm; produto custa apenas R$: " + precoTerceiro.toFixed(2) + "</p>";
        }
    </script>
 
</body>
</html>
